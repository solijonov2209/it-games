<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Iloncha - Web O'yin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js ovoz effektlari uchun -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- FontAwesome ikonkalari -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #064e3b 0%, #020617 100%);
            color: #f8fafc;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        .font-gaming {
            font-family: 'Orbitron', sans-serif;
        }

        #game-board {
            background-color: #090d16;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(16, 185, 129, 0.4);
        }

        .emerald-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
            transition: all 0.2s ease;
        }

        .emerald-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
        }

        .emerald-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-4">

    <!-- Yuqori Panel (Ball va Rekord) -->
    <header class="w-full max-w-md flex justify-between items-center bg-slate-900/80 backdrop-blur-md border border-emerald-500/30 rounded-2xl px-5 py-3 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 flex items-center justify-center text-emerald-400">
                <i class="fa-solid fa-apple-whole text-xl"></i>
            </div>
            <div>
                <span class="text-xs text-slate-400 uppercase block font-semibold">Ball</span>
                <span id="score" class="font-gaming text-xl font-bold text-emerald-400">0</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="text-right">
                <span class="text-xs text-slate-400 uppercase block font-semibold">Rekord</span>
                <span id="high-score" class="font-gaming text-xl font-bold text-amber-400">0</span>
            </div>
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400">
                <i class="fa-solid fa-crown text-lg"></i>
            </div>
        </div>

        <button id="sound-btn" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
            <i id="sound-icon" class="fa-solid fa-volume-high"></i>
        </button>
    </header>

    <!-- Asosiy O'yin Maydoni -->
    <main class="relative flex items-center justify-center my-2">
        <canvas id="game-board" class="rounded-2xl"></canvas>

        <!-- Boshlash Ekrani -->
        <div id="start-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 text-center z-10">
            <div class="w-16 h-16 bg-emerald-500/20 border-2 border-emerald-400 rounded-2xl flex items-center justify-center mb-4 animate-pulse">
                <i class="fa-solid fa-staff-snake text-3xl text-emerald-400"></i>
            </div>
            <h1 class="font-gaming text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200 mb-2">
                NEON ILONCHA
            </h1>
            <p class="text-slate-300 text-sm mb-6">
                Olmalarni yeb ilonchani o'stiring. Devorga yoki o'zingizga urilib ketmang!
            </p>
            <button id="start-btn" class="emerald-btn font-gaming text-white font-bold px-8 py-3.5 rounded-xl tracking-wider cursor-pointer">
                BOSHLASH
            </button>
        </div>

        <!-- Yutqazish Ekrani -->
        <div id="gameover-overlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center z-10">
            <h2 class="font-gaming text-3xl font-extrabold text-rose-500 mb-1">O'YIN TUGADI!</h2>
            <p class="text-slate-400 text-sm mb-5">Iloncha to'qnashib ketdi</p>
            
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 w-full max-w-[220px] mb-6">
                <div class="flex justify-between text-sm mb-2">
                    <span class="text-slate-400">Natija:</span>
                    <span id="final-score" class="font-gaming font-bold text-emerald-400">0</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Rekord:</span>
                    <span id="final-high" class="font-gaming font-bold text-amber-400">0</span>
                </div>
            </div>

            <button id="restart-btn" class="emerald-btn font-gaming text-white font-bold px-8 py-3.5 rounded-xl tracking-wider cursor-pointer">
                QAYTA O'YNASH
            </button>
        </div>
    </main>

    <!-- Mobil Boshqaruv Tugmalari (D-Pad) -->
    <footer class="w-full max-w-xs flex flex-col items-center gap-2 pb-2 md:hidden">
        <button data-dir="UP" class="dpad-btn w-16 h-14 bg-slate-800/80 active:bg-emerald-600 border border-slate-700 rounded-2xl flex items-center justify-center text-xl shadow-lg">
            <i class="fa-solid fa-chevron-up"></i>
        </button>
        <div class="flex gap-6">
            <button data-dir="LEFT" class="dpad-btn w-16 h-14 bg-slate-800/80 active:bg-emerald-600 border border-slate-700 rounded-2xl flex items-center justify-center text-xl shadow-lg">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button data-dir="DOWN" class="dpad-btn w-16 h-14 bg-slate-800/80 active:bg-emerald-600 border border-slate-700 rounded-2xl flex items-center justify-center text-xl shadow-lg">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            <button data-dir="RIGHT" class="dpad-btn w-16 h-14 bg-slate-800/80 active:bg-emerald-600 border border-slate-700 rounded-2xl flex items-center justify-center text-xl shadow-lg">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </footer>

    <!-- Kompyuter uchun eslatma -->
    <div class="hidden md:block text-xs text-slate-400 pb-2">
        Boshqarish uchun klaviaturadagi <span class="text-emerald-400 font-bold">◀ ▲ ▼ ▶</span> yoki <span class="text-emerald-400 font-bold">W A S D</span> tugmalaridan foydalaning
    </div>

    <script>
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');

        // UI Elementlar
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const startOverlay = document.getElementById('start-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const finalScoreEl = document.getElementById('final-score');
        const finalHighEl = document.getElementById('final-high');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');

        // O'yin sozlamalari
        const tileCount = 20; // 20x20 katak
        let tileSize = 20;
        let snake = [];
        let food = { x: 10, y: 10 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('iloncha_rekord') || 0;
        let gameInterval;
        let gameSpeed = 130;
        let isRunning = false;
        let soundEnabled = true;

        highScoreEl.innerText = highScore;

        // Ovoz tizimi (Tone.js)
        let synth;
        function initSound() {
            if (!synth) {
                synth = new Tone.Synth().toDestination();
            }
        }

        function playTone(type) {
            if (!soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                if (type === 'eat') {
                    synth.triggerAttackRelease("E5", "16n");
                } else if (type === 'over') {
                    const now = Tone.now();
                    synth.triggerAttackRelease("C4", "8n", now);
                    synth.triggerAttackRelease("G3", "4n", now + 0.15);
                }
            } catch (e) {}
        }

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundIcon.className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-rose-400';
        });

        // Canvas o'lchamini ekranga moslashtirish
        function setBoardSize() {
            const maxWidth = Math.min(window.innerWidth - 32, 420);
            const maxHeight = window.innerHeight - 260;
            const size = Math.max(260, Math.min(maxWidth, maxHeight));
            
            tileSize = Math.floor(size / tileCount);
            canvas.width = tileSize * tileCount;
            canvas.height = tileSize * tileCount;
            if (!isRunning) drawBoard();
        }
        window.addEventListener('resize', setBoardSize);

        // Yangi olma joylashtirish
        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Ilon ustiga tushib qolmasligini tekshirish
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                    break;
                }
            }
        }

        // Maydonni chizish
        function drawBoard() {
            // Orqa fon
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Yengil katak chiziqlari
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * tileSize);
                ctx.lineTo(canvas.width, i * tileSize);
                ctx.stroke();
            }

            // Olmani chizish (Neon qizil)
            const foodX = food.x * tileSize + tileSize / 2;
            const foodY = food.y * tileSize + tileSize / 2;
            ctx.fillStyle = '#f43f5e';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#f43f5e';
            ctx.beginPath();
            ctx.arc(foodX, foodY, tileSize / 2.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Ilonchani chizish
            snake.forEach((part, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? '#34d399' : '#10b981';
                
                if (isHead) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#34d399';
                }

                const padding = 1.5;
                ctx.beginPath();
                ctx.roundRect(
                    part.x * tileSize + padding,
                    part.y * tileSize + padding,
                    tileSize - padding * 2,
                    tileSize - padding * 2,
                    isHead ? 6 : 4
                );
                ctx.fill();
                ctx.shadowBlur = 0;

                // Ilon ko'zlari
                if (isHead) {
                    ctx.fillStyle = '#020617';
                    const eyeSize = Math.max(2, tileSize / 7);
                    ctx.beginPath();
                    ctx.arc(part.x * tileSize + tileSize * 0.3, part.y * tileSize + tileSize * 0.35, eyeSize, 0, Math.PI * 2);
                    ctx.arc(part.x * tileSize + tileSize * 0.7, part.y * tileSize + tileSize * 0.35, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // O'yin mantig'ini yangilash
        function updateGame() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Devorga urilishni tekshirish
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return gameOver();
            }

            // O'z tanasiga urilishni tekshirish
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    return gameOver();
                }
            }

            snake.unshift(head);

            // Olma yeyishni tekshirish
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                playTone('eat');
                spawnFood();

                // Tezlikni biroz oshirish
                if (gameSpeed > 65) {
                    clearInterval(gameInterval);
                    gameSpeed -= 2;
                    gameInterval = setInterval(updateGame, gameSpeed);
                }
            } else {
                snake.pop();
            }

            drawBoard();
        }

        // O'yin tugashi
        function gameOver() {
            isRunning = false;
            clearInterval(gameInterval);
            playTone('over');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('iloncha_rekord', highScore);
                highScoreEl.innerText = highScore;
            }

            finalScoreEl.innerText = score;
            finalHighEl.innerText = highScore;
            gameoverOverlay.classList.remove('hidden');
        }

        // Yo'nalishni o'zgartirish
        function changeDirection(dir) {
            if (!isRunning) return;
            if (dir === 'UP' && dy !== 1) { nextDx = 0; nextDy = -1; }
            if (dir === 'DOWN' && dy !== -1) { nextDx = 0; nextDy = 1; }
            if (dir === 'LEFT' && dx !== 1) { nextDx = -1; nextDy = 0; }
            if (dir === 'RIGHT' && dx !== -1) { nextDx = 1; nextDy = 0; }
        }

        // Klaviatura boshqaruvi
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') changeDirection('UP');
            if (e.code === 'ArrowDown' || e.code === 'KeyS') changeDirection('DOWN');
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeDirection('LEFT');
            if (e.code === 'ArrowRight' || e.code === 'KeyD') changeDirection('RIGHT');
        });

        // Mobil tugmalar boshqaruvi
        document.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                changeDirection(btn.dataset.dir);
            });
            btn.addEventListener('click', () => changeDirection(btn.dataset.dir));
        });

        // Ekranda barmoq bilan surish (Swipe) boshqaruvi
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            if (!isRunning) return;
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 20) changeDirection('RIGHT');
                else if (diffX < -20) changeDirection('LEFT');
            } else {
                if (diffY > 20) changeDirection('DOWN');
                else if (diffY < -20) changeDirection('UP');
            }
        });

        // O'yinni boshlash
        function startGame() {
            initSound();
            setBoardSize();
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1; dy = 0;
            nextDx = 1; nextDy = 0;
            score = 0;
            gameSpeed = 130;
            scoreEl.innerText = score;

            startOverlay.classList.add('hidden');
            gameoverOverlay.classList.add('hidden');

            spawnFood();
            isRunning = true;
            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, gameSpeed);
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        window.onload = setBoardSize;
    </script>
</body>
</html>
