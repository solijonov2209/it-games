<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Arcade Poyga</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="360" height="600"></canvas>

        <!-- Boshlash oynasi -->
        <div id="startScreen" class="overlay">
            <h1>RETRO<br>POYGA</h1>

            <div class="label">REJIM</div>
            <div class="choice" id="modeChoice">
                <button class="pick sel" data-mode="1">1 O'YINCHI</button>
                <button class="pick" data-mode="2">2 O'YINCHI</button>
            </div>

            <div class="label">TRASSA</div>
            <div class="choice" id="trackChoice"></div>

            <p class="help">
                1-o'yinchi: <b>A / D</b><br>
                2-o'yinchi: <b>STRELKALAR</b><br>
                <b style="color:#00ff66">[N]</b> nitro · <b style="color:#ffea00">$</b> tanga · <b style="color:#4da3ff">[S]</b> qalqon<br>
                P / Esc — pauza
            </p>
            <button class="btn" id="startBtn">BOSHLASH</button>
        </div>

        <!-- Pauza -->
        <div id="pauseScreen" class="overlay hidden">
            <h1>PAUZA</h1>
            <p>Davom etish uchun P bosing</p>
            <button class="btn" id="resumeBtn">DAVOM</button>
        </div>

        <!-- Yutqazish oynasi -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="overTitle">O'YIN<br>TUGADI!</h1>
            <p id="overText">Sizning ochko: <span id="finalScore" style="color:#ffea00">0</span></p>
            <button class="btn" id="restartBtn">QAYTA O'YNASH</button>
            <button class="btn btn2" id="menuBtn">MENYU</button>
        </div>
    </div>

    <!-- Telefon va planshetlar uchun tugmalar -->
    <div class="controls">
        <button class="touch-btn" id="leftBtn"><</button>
        <button class="touch-btn" id="rightBtn">></button>
    </div>

    <script src="main.js"></script>
</body>
</html>
