<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonni top</title>
  <style>
    body {
      margin: 0; height: 100vh; display: grid; place-items: center;
      font-family: Arial, sans-serif; color: #fff;
      background: linear-gradient(135deg, #1e90ff, #6c4cf5);
    }
    .box {
      width: min(420px, 90vw); padding: 30px; border-radius: 24px; text-align: center;
      background: rgba(255,255,255,0.15); backdrop-filter: blur(6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    h1 { margin: 0 0 6px; }
    .hint { font-size: 22px; min-height: 30px; margin: 18px 0; font-weight: bold; }
    input {
      width: 140px; padding: 12px; font-size: 26px; text-align: center;
      border: none; border-radius: 14px; outline: none;
    }
    button {
      padding: 12px 20px; font-size: 20px; border: none; border-radius: 14px;
      background: #ffcc00; color: #222; font-weight: bold; cursor: pointer; margin-left: 6px;
    }
    .tries { margin-top: 14px; opacity: 0.85; }
    .history { margin-top: 8px; font-size: 15px; opacity: 0.8; min-height: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔢 Sonni top</h1>
    <div>Men 1 dan 100 gacha son o'yladim</div>
    <div id="hint" class="hint">Taxminingizni yozing 👇</div>
    <form id="form">
      <input id="guess" type="number" min="1" max="100" autofocus>
      <button type="submit">Tekshir</button>
    </form>
    <div class="tries">Urinishlar: <b id="tries">0</b></div>
    <div id="history" class="history"></div>
  </div>

  <script>
    var secret, tries, history;
    var input = document.getElementById("guess");
    var hint = document.getElementById("hint");

    function newGame() {
      secret = Math.floor(Math.random() * 100) + 1;
      tries = 0;
      history = [];
      document.getElementById("tries").textContent = 0;
      document.getElementById("history").textContent = "";
      input.value = "";
      input.focus();
    }

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      // O'yin tugagan bo'lsa — yangisini boshlaymiz
      if (secret === null) {
        hint.textContent = "Yangi son o'ylandi! 👇";
        return newGame();
      }
      var n = Number(input.value);
      if (!n || n < 1 || n > 100) {
        hint.textContent = "⚠️ 1 dan 100 gacha son yozing";
        return;
      }
      tries++;
      history.push(n);
      document.getElementById("tries").textContent = tries;
      document.getElementById("history").textContent = history.join(" · ");

      if (n < secret) hint.textContent = "⬆️ Kattaroq son!";
      else if (n > secret) hint.textContent = "⬇️ Kichikroq son!";
      else {
        hint.textContent = "🎉 Topdingiz! " + tries + " urinishda. Enter — yana o'ynash";
        secret = null;
      }
      input.value = "";
      input.focus();
    });

    newGame();
  </script>
</body>
</html>
