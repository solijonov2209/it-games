<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Sakrash o‘yini</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    canvas {
      display: block;
      width: min(94vw, 700px);
      height: min(65vh, 420px);
      border: 2px solid #67e8f9;
      border-radius: 12px;
      background: #b9e9ff;
      touch-action: manipulation;
    }

    button {
      padding: 12px 28px;
      border: 0;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h2>🏃 3D Sakrash</h2>
    <p>Space, ↑ yoki tugma orqali sakrang</p>
    <canvas id="game"></canvas>
    <p id="score">Hisob: 0</p>
    <button id="jump">SAKRASH</button>
    <p id="message">Boshlash uchun sakrash tugmasini bosing</p>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const scoreText = document.querySelector("#score");
    const message = document.querySelector("#message");

    let playerY = 0;
    let velocity = 0;
    let obstacles = [];
    let score = 0;
    let running = false;
    let lastTime = 0;
    let spawnTime = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    addEventListener("resize", resize);
    resize();

    function jump() {
      if (!running) {
        running = true;
        score = 0;
        obstacles = [];
        playerY = 0;
        velocity = 0;
        spawnTime = 0;
        lastTime = performance.now();
        message.textContent = "To‘siqlardan sakrab o‘ting!";
        requestAnimationFrame(loop);
      }

      if (playerY === 0) {
        velocity = -12;
      }
    }

    document.querySelector("#jump").addEventListener("click", jump);
    canvas.addEventListener("pointerdown", jump);

    document.addEventListener("keydown", event => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        jump();
      }
    });

    function drawCube(x, y, size, color) {
      const d = size * 0.35;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + d, y - d);
      ctx.lineTo(x + size + d, y - d);
      ctx.lineTo(x + size, y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#00000044";
      ctx.beginPath();
      ctx.moveTo(x + size, y);
      ctx.lineTo(x + size + d, y - d);
      ctx.lineTo(x + size + d, y + size - d);
      ctx.lineTo(x + size, y + size);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = color;
      ctx.fillRect(x, y, size, size);
      ctx.strokeStyle = "#ffffffaa";
      ctx.strokeRect(x, y, size, size);
    }

    function loop(time) {
      if (!running) return;

      const dt = Math.min((time - lastTime) / 16.67, 2);
      lastTime = time;

      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const ground = h * 0.78;

      // Osmon
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#60a5fa");
      sky.addColorStop(1, "#dbeafe");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // Tog‘lar
      ctx.fillStyle = "#7c9db5";
      ctx.beginPath();
      ctx.moveTo(0, ground);
      ctx.lineTo(w * 0.2, h * 0.3);
      ctx.lineTo(w * 0.42, ground);
      ctx.lineTo(w * 0.65, h * 0.4);
      ctx.lineTo(w, ground);
      ctx.fill();

      // Yer
      ctx.fillStyle = "#39734a";
      ctx.fillRect(0, ground, w, h - ground);
      ctx.fillStyle = "#b7e36b";
      ctx.fillRect(0, ground, w, 8);

      // O‘yinchi
      velocity += 0.6 * dt;
      playerY += velocity * dt;

      if (playerY > 0) {
        playerY = 0;
        velocity = 0;
      }

      const playerX = w * 0.18;
      const playerSize = 42;
      const playerBaseY = ground - playerSize + playerY;

      drawCube(playerX, playerBaseY, playerSize, "#2563eb");

      // To‘siqlar
      spawnTime += dt;

      if (spawnTime > 85) {
        obstacles.push({
          x: w + 20,
          size: 25 + Math.random() * 20
        });
        spawnTime = 0;
      }

      for (const obstacle of obstacles) {
        obstacle.x -= 5 * dt;

        const size = obstacle.size;
        const obstacleY = ground - size;

        drawCube(obstacle.x, obstacleY, size, "#ef4444");

        const hit =
          playerX + playerSize - 8 > obstacle.x &&
          playerX + 8 < obstacle.x + size &&
          playerBaseY + playerSize - 5 > obstacleY;

        if (hit) {
          running = false;
          message.textContent =
            "O‘yin tugadi! Qayta o‘ynash uchun sakrang.";
        }
      }

      obstacles = obstacles.filter(obstacle => obstacle.x > -80);

      if (running) {
        score += dt * 0.2; // Hisob 5 baravar sekin oshadi
        scoreText.textContent = "Hisob: " + Math.floor(score);
        requestAnimationFrame(loop);
      }
    }
  </script>
</body>
</html>
