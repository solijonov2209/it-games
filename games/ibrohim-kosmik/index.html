<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kosmik jang</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05061a; font-family: Arial, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 26px;
      color: #fff; font: bold 17px Arial, sans-serif; pointer-events: none;
    }
    .msg {
      position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
      color: #fff; font: bold 18px Arial, sans-serif; background: rgba(5, 6, 26, 0.7);
    }
    .msg h1 { font-size: 44px; margin: 0 0 10px; color: #ffcc00; }
    .row { display: flex; gap: 8px; justify-content: center; margin: 12px 0; }
    .opt { padding: 9px 16px; border-radius: 999px; border: 2px solid #7cf2ff; background: transparent; color: #fff; font-weight: bold; cursor: pointer; font-size: 15px; }
    .opt.sel { background: #7cf2ff; color: #05061a; }
    .go { padding: 12px 30px; font-size: 20px; border: none; border-radius: 999px; background: #ffcc00; color: #222; font-weight: bold; cursor: pointer; }
    small { font-weight: normal; opacity: 0.85; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
  <div class="msg" id="msg">
    <div>
      <h1>🚀 Kosmik jang</h1>
      <div id="result"></div>
      <div class="row" id="modes">
        <button class="opt sel" data-p="1">👤 1 o'yinchi</button>
        <button class="opt" data-p="2">👥 2 o'yinchi (birga)</button>
      </div>
      <small>1-o'yinchi: <b>A D</b> — harakat, <b>Probel</b> — o'q · 2-o'yinchi: <b>← →</b>, <b>Enter</b><br>
      Telefonda: barmoq bilan suring, kema o'zi otadi<br>
      ⚡ qo'sh o'q · 🛡️ qalqon · ❤️ qo'shimcha jon · har 30 ochkoda 👹 BOSS!</small><br><br>
      <button class="go" id="go">▶ Boshlash</button>
    </div>
  </div>

  <script>
    var canvas = document.getElementById("c");
    var ctx = canvas.getContext("2d");
    var W, H;
    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
    addEventListener("resize", resize);
    resize();

    // Yulduzli fon
    var stars = [];
    for (var i = 0; i < 140; i++) stars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 2 + 0.5 });

    var playerCount = 1, ships, bullets, enemies, enemyShots, powerups, particles, boss;
    var score, lives, playing = false, keys = {}, spawnTimer = 0, nextBoss = 30;
    var best = Number(localStorage.getItem("ibrohim-kosmik-best")) || 0;

    document.getElementById("modes").addEventListener("click", function (e) {
      var b = e.target.closest(".opt"); if (!b) return;
      document.querySelectorAll("#modes .opt").forEach(function (x) { x.classList.toggle("sel", x === b); });
      playerCount = Number(b.dataset.p);
    });

    function start() {
      ships = [];
      for (var i = 0; i < playerCount; i++) {
        ships.push({ id: i, x: W * (playerCount === 2 ? (i ? 0.65 : 0.35) : 0.5), y: H - 70, lastShot: 0, double: 0, shield: 0 });
      }
      bullets = []; enemies = []; enemyShots = []; powerups = []; particles = []; boss = null;
      score = 0; lives = 3 + (playerCount - 1) * 2; playing = true; nextBoss = 30; spawnTimer = 0;
      document.getElementById("msg").style.display = "none";
    }
    document.getElementById("go").onclick = start;

    function updateHud() {
      document.getElementById("hud").innerHTML =
        "<span>⭐ " + score + "</span><span>❤️ " + lives + "</span><span>🏆 " + best + "</span>" +
        (boss ? "<span>👹 " + boss.hp + "</span>" : "");
    }

    function shoot(s, now) {
      if (now - s.lastShot < 220) return;
      s.lastShot = now;
      if (s.double > 0) {
        bullets.push({ x: s.x - 10, y: s.y - 24 }, { x: s.x + 10, y: s.y - 24 });
      } else {
        bullets.push({ x: s.x, y: s.y - 24 });
      }
    }

    function explode(x, y, color, n) {
      for (var i = 0; i < (n || 14); i++) {
        particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 30, color: color });
      }
    }

    function hurt(s) {
      if (s.shield > 0) { s.shield = 0; explode(s.x, s.y, "#7cf2ff"); return; }
      lives--;
      explode(s.x, s.y, "#ff3d5a", 24);
      if (lives <= 0) gameOver();
    }

    function update(now) {
      stars.forEach(function (s) { s.y += s.s / 600; if (s.y > 1) s.y = 0; });
      if (!playing) return;

      // O'yinchilar harakati
      ships.forEach(function (s) {
        var left = s.id === 0 ? (keys.KeyA || (playerCount === 1 && keys.ArrowLeft)) : keys.ArrowLeft;
        var right = s.id === 0 ? (keys.KeyD || (playerCount === 1 && keys.ArrowRight)) : keys.ArrowRight;
        var fire = s.id === 0 ? (keys.Space || touchActive) : (keys.Enter || keys.NumpadEnter);
        if (left) s.x -= 7;
        if (right) s.x += 7;
        s.x = Math.max(25, Math.min(W - 25, s.x));
        if (fire) shoot(s, now);
        if (s.double > 0) s.double--;
        if (s.shield > 0) s.shield--;
      });

      bullets.forEach(function (b) { b.y -= 10; });
      bullets = bullets.filter(function (b) { return b.y > -10; });

      // Boss chiqishi
      if (!boss && score >= nextBoss) {
        boss = { x: W / 2, y: -60, hp: 25 + nextBoss / 2, dir: 1, shotTimer: 0 };
        nextBoss += 30;
      }

      // Oddiy dushmanlar (boss paytida kamroq)
      spawnTimer--;
      if (spawnTimer <= 0) {
        enemies.push({ x: 30 + Math.random() * (W - 60), y: -30, speed: 1.5 + Math.random() * 1.5 + score / 50 });
        spawnTimer = (boss ? 70 : Math.max(16, 55 - score)) / (playerCount === 2 ? 1.3 : 1);
      }
      enemies.forEach(function (e) { e.y += e.speed; });

      // Boss harakati va o'q otishi
      if (boss) {
        if (boss.y < 80) boss.y += 1.5;
        boss.x += boss.dir * 2.5;
        if (boss.x < 80 || boss.x > W - 80) boss.dir *= -1;
        boss.shotTimer--;
        if (boss.shotTimer <= 0) {
          enemyShots.push({ x: boss.x - 30, y: boss.y + 30 }, { x: boss.x + 30, y: boss.y + 30 });
          boss.shotTimer = 45;
        }
        bullets = bullets.filter(function (b) {
          if (Math.abs(b.x - boss.x) < 60 && Math.abs(b.y - boss.y) < 40) {
            boss.hp--;
            explode(b.x, b.y, "#ffcc00", 4);
            return false;
          }
          return true;
        });
        if (boss.hp <= 0) {
          explode(boss.x, boss.y, "#ff7a00", 60);
          score += 15;
          powerups.push({ x: boss.x, y: boss.y, type: "❤️" });
          boss = null;
        }
      }
      enemyShots.forEach(function (s) { s.y += 5; });
      enemyShots = enemyShots.filter(function (s) {
        var hit = ships.find(function (p) { return Math.abs(p.x - s.x) < 20 && Math.abs(p.y - s.y) < 22; });
        if (hit) { hurt(hit); return false; }
        return s.y < H + 10;
      });

      // To'qnashuvlar
      enemies = enemies.filter(function (e) {
        for (var i = 0; i < bullets.length; i++) {
          if (Math.abs(bullets[i].x - e.x) < 22 && Math.abs(bullets[i].y - e.y) < 22) {
            bullets.splice(i, 1);
            score++;
            explode(e.x, e.y, "#ffcc00");
            // Ba'zan bonus tushadi
            // (⚡ ko'proq, ❤️ kamroq tushadi)
            if (Math.random() < 0.12) powerups.push({ x: e.x, y: e.y, type: ["⚡", "⚡", "🛡️", "❤️"][Math.floor(Math.random() * 4)] });
            return false;
          }
        }
        var ship = ships.find(function (s) { return Math.abs(s.x - e.x) < 32 && Math.abs(s.y - e.y) < 30; });
        if (ship) { hurt(ship); return false; }
        if (e.y > H + 30) { hurt(ships[0]); return false; }
        return true;
      });

      // Bonuslar
      powerups.forEach(function (p) { p.y += 2.5; });
      powerups = powerups.filter(function (p) {
        var s = ships.find(function (s) { return Math.abs(s.x - p.x) < 34 && Math.abs(s.y - p.y) < 34; });
        if (s) {
          if (p.type === "⚡") s.double = 480;   // ~8 soniya
          if (p.type === "🛡️") s.shield = 600;
          if (p.type === "❤️") lives++;
          return false;
        }
        return p.y < H + 30;
      });

      particles.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.life--; });
      particles = particles.filter(function (p) { return p.life > 0; });
      updateHud();
    }

    function draw() {
      ctx.fillStyle = "#05061a";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      stars.forEach(function (s) { ctx.fillRect(s.x * W, s.y * H, s.s, s.s); });
      if (!ships) return;

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (playing) {
        ships.forEach(function (s) {
          ctx.font = "40px Arial";
          ctx.fillText("🚀", s.x, s.y);
          if (playerCount === 2) {
            ctx.font = "bold 12px Arial";
            ctx.fillStyle = s.id ? "#ffb648" : "#7cf2ff";
            ctx.fillText(s.id ? "P2" : "P1", s.x, s.y + 30);
          }
          if (s.shield > 0) {
            ctx.strokeStyle = "#7cf2ff"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(s.x, s.y, 32, 0, Math.PI * 2); ctx.stroke();
          }
        });
      }
      ctx.font = "40px Arial";
      enemies.forEach(function (e) { ctx.fillText("👾", e.x, e.y); });
      ctx.font = "30px Arial";
      powerups.forEach(function (p) { ctx.fillText(p.type, p.x, p.y); });
      if (boss) { ctx.font = "90px Arial"; ctx.fillText("👹", boss.x, boss.y); }

      ctx.fillStyle = "#7cf2ff";
      bullets.forEach(function (b) { ctx.fillRect(b.x - 2, b.y - 10, 4, 14); });
      ctx.fillStyle = "#ff5c7a";
      enemyShots.forEach(function (s) { ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fill(); });

      particles.forEach(function (p) {
        ctx.globalAlpha = p.life / 30;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
      });
      ctx.globalAlpha = 1;
    }

    function gameOver() {
      playing = false;
      if (score > best) { best = score; localStorage.setItem("ibrohim-kosmik-best", best); }
      document.getElementById("result").innerHTML = "💥 O'yin tugadi! Ball: <b>" + score + "</b> · Rekord: " + best + "<br><br>";
      document.getElementById("go").textContent = "🔄 Qayta o'ynash";
      document.getElementById("msg").style.display = "grid";
    }

    function loop(now) {
      update(now);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Klaviatura
    addEventListener("keydown", function (e) {
      keys[e.code] = true;
      if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
      if (!playing && e.code === "Enter") start();
    });
    addEventListener("keyup", function (e) { keys[e.code] = false; });

    // Sensorli ekran: barmoq turgan joyga 1-kema boradi va o'zi otadi
    var touchActive = false;
    function onTouch(e) {
      if (!playing) return;
      touchActive = true;
      ships[0].x = e.touches[0].clientX;
    }
    canvas.addEventListener("touchstart", onTouch);
    canvas.addEventListener("touchmove", function (e) { e.preventDefault(); onTouch(e); }, { passive: false });
    canvas.addEventListener("touchend", function () { touchActive = false; });
  </script>
</body>
</html>
