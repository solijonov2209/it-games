<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 boshqotirma</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: Arial, sans-serif; color: #fff; user-select: none;
      background: linear-gradient(160deg, #6c4cf5, #00b37e);
    }
    h1 { margin: 0; font-size: 26px; text-align: center; }
    .bar { display: flex; gap: 6px; }
    .opt {
      padding: 6px 14px; border-radius: 999px; border: 2px solid #ffffff99; background: transparent;
      color: #fff; font-weight: bold; cursor: pointer;
    }
    .opt.sel { background: #fff; color: #6c4cf5; }
    .hud { font-size: 17px; display: flex; gap: 18px; }
    .board {
      position: relative; width: min(88vw, 60vh); aspect-ratio: 1;
      background: #ffffff33; border-radius: 18px;
    }
    .tile {
      position: absolute; display: grid; place-items: center; border-radius: 10px; cursor: pointer;
      background: #fff; color: #6c4cf5; font-weight: 900;
      box-shadow: 0 5px 0 #c9c0ff; transition: left 0.12s, top 0.12s;
    }
    .tile.right { background: #d6ffe9; color: #00875f; box-shadow: 0 5px 0 #8fe0b8; }
    button.shuffle {
      padding: 10px 24px; font-size: 18px; border: none; border-radius: 999px;
      background: #ffcc00; color: #222; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="title">🧩 Raqamli boshqotirma</h1>
  <div class="bar" id="sizes">
    <button class="opt" data-n="3">3×3</button>
    <button class="opt sel" data-n="4">4×4</button>
    <button class="opt" data-n="5">5×5</button>
  </div>
  <div class="hud">
    <span>Yurish: <b id="moves">0</b></span>
    <span>⏱ <b id="time">0</b> s</span>
    <span>🏆 <b id="best">—</b></span>
  </div>
  <div class="board" id="board"></div>
  <button class="shuffle" id="shuffle">🔀 Aralashtirish</button>

  <script>
    var board = document.getElementById("board");
    var N = 4;        // taxta o'lchami (N×N)
    var tiles = [];   // tiles[pozitsiya] = raqam (0 — bo'sh katak)
    var moves = 0, seconds = 0, timer = null, solved = false;

    document.getElementById("sizes").addEventListener("click", function (e) {
      var btn = e.target.closest(".opt");
      if (!btn) return;
      document.querySelectorAll("#sizes .opt").forEach(function (b) { b.classList.toggle("sel", b === btn); });
      N = Number(btn.dataset.n);
      shuffle();
    });

    function bestKey() { return "dinislom-15-best-" + N; }

    function draw() {
      board.innerHTML = "";
      var gap = 6, pad = 8;
      var size = "((100% - " + (pad * 2) + "px) / " + N + ")";
      tiles.forEach(function (n, pos) {
        if (n === 0) return;
        var el = document.createElement("div");
        el.className = "tile" + (n === pos + 1 ? " right" : "");
        el.textContent = n;
        el.style.width = el.style.height = "calc(" + size + " - " + gap + "px)";
        el.style.left = "calc(" + pad + "px + " + size + " * " + (pos % N) + " + " + gap / 2 + "px)";
        el.style.top = "calc(" + pad + "px + " + size + " * " + Math.floor(pos / N) + " + " + gap / 2 + "px)";
        el.style.fontSize = "clamp(16px, " + (24 / N) + "vw, " + (160 / N) + "px)";
        el.onclick = function () { tryMove(pos); };
        board.appendChild(el);
      });
      document.getElementById("moves").textContent = moves;
      document.getElementById("time").textContent = seconds;
      var best = localStorage.getItem(bestKey());
      document.getElementById("best").textContent = best ? best + " s" : "—";
    }

    // Katak bo'sh joy yonida bo'lsa — suramiz
    function tryMove(pos) {
      if (solved) return;
      var empty = tiles.indexOf(0);
      var sameRow = Math.floor(pos / N) === Math.floor(empty / N);
      var near = (Math.abs(pos - empty) === 1 && sameRow) || Math.abs(pos - empty) === N;
      if (!near) return;
      if (!timer) timer = setInterval(function () { seconds++; draw(); }, 1000);
      tiles[empty] = tiles[pos];
      tiles[pos] = 0;
      moves++;
      draw();
      checkWin();
    }

    function checkWin() {
      for (var i = 0; i < N * N - 1; i++) if (tiles[i] !== i + 1) return;
      solved = true;
      clearInterval(timer);
      var best = Number(localStorage.getItem(bestKey())) || 0;
      var record = !best || seconds < best;
      if (record) localStorage.setItem(bestKey(), seconds);
      document.getElementById("title").textContent =
        "🎉 Yechildi! " + moves + " yurish, " + seconds + " s" + (record ? " — rekord!" : "");
      draw();
    }

    // Har doim yechiladigan bo'lishi uchun tartibli holatdan tasodifiy yurishlar qilamiz
    function shuffle() {
      tiles = [];
      for (var i = 1; i < N * N; i++) tiles.push(i);
      tiles.push(0);
      var prev = -1;
      for (var k = 0; k < N * N * 25; k++) {
        var empty = tiles.indexOf(0);
        var options = [empty - N, empty + N];
        if (empty % N !== 0) options.push(empty - 1);
        if (empty % N !== N - 1) options.push(empty + 1);
        options = options.filter(function (p) { return p >= 0 && p < N * N && p !== prev; });
        var p = options[Math.floor(Math.random() * options.length)];
        tiles[empty] = tiles[p]; tiles[p] = 0;
        prev = empty;
      }
      moves = 0; seconds = 0; solved = false;
      clearInterval(timer); timer = null;
      document.getElementById("title").textContent = "🧩 Raqamli boshqotirma";
      draw();
    }

    // Strelka bosilganda bo'sh joyga qo'shni katak suriladi
    document.addEventListener("keydown", function (e) {
      var empty = tiles.indexOf(0);
      var map = { ArrowUp: empty + N, ArrowDown: empty - N, ArrowLeft: empty + 1, ArrowRight: empty - 1 };
      if (!(e.key in map)) return;
      e.preventDefault();
      var p = map[e.key];
      var sameRow = Math.floor(p / N) === Math.floor(empty / N);
      if (p >= 0 && p < N * N && (Math.abs(p - empty) === N || sameRow)) tryMove(p);
    });

    document.getElementById("shuffle").onclick = shuffle;
    shuffle();
  </script>
</body>
</html>
