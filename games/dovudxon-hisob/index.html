<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tez hisob</title>
  <style>
    body {
      margin: 0; height: 100vh; display: grid; place-items: center;
      font-family: Arial, sans-serif; color: #3a2400; user-select: none;
      background: linear-gradient(135deg, #ffcc00, #ff7a00);
    }
    .box { width: min(460px, 92vw); text-align: center; }
    .hud { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; }
    .bar { height: 10px; background: #ffffff66; border-radius: 99px; overflow: hidden; margin: 10px 0 24px; }
    .bar div { height: 100%; background: #3a2400; width: 100%; transition: width 0.1s linear; }
    .question {
      font-size: clamp(40px, 10vw, 64px); font-weight: 900; padding: 20px;
      background: #fff; border-radius: 24px; box-shadow: 0 10px 0 #c85f00; margin-bottom: 24px;
    }
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .answers button {
      font-size: 30px; font-weight: bold; padding: 16px; border: none; border-radius: 18px;
      background: #fff8e6; color: #3a2400; cursor: pointer; box-shadow: 0 6px 0 #d08c33;
    }
    .answers button:active { transform: translateY(4px); box-shadow: 0 2px 0 #d08c33; }
    .answers small { font-size: 14px; opacity: 0.5; display: block; }
    .ok { background: #7cf29b !important; }
    .bad { background: #ff8a8a !important; }
    .start {
      font-size: 22px; padding: 14px 34px; border: none; border-radius: 999px;
      background: #3a2400; color: #fff; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="hud">
      <span>⭐ <span id="score">0</span></span>
      <span>🏆 <span id="best">0</span></span>
      <span>⏱ <span id="time">60</span></span>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="question" id="question">➕ Tez hisob</div>
    <div class="answers" id="answers"></div>
    <div id="startBox" style="margin-top:20px">
      <p>60 soniyada iloji boricha ko'p misol yeching!<br>Javobni bosing yoki 1–4 raqamlarini ishlating.</p>
      <button class="start" id="start">▶ Boshlash</button>
    </div>
  </div>

  <script>
    var score = 0, timeLeft = 60, timer = null, correct = 0, playing = false;
    var best = Number(localStorage.getItem("dovudxon-hisob-best")) || 0;
    document.getElementById("best").textContent = best;

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    // Yangi misol: ball oshgani sari qiyinlashadi
    function newQuestion() {
      var level = 1 + Math.floor(score / 5);
      var ops = level < 2 ? ["+", "-"] : ["+", "-", "×"];
      var op = ops[rand(0, ops.length - 1)];
      var a, b;
      if (op === "×") { a = rand(2, 5 + level); b = rand(2, 9); correct = a * b; }
      else if (op === "+") { a = rand(1, 10 * level); b = rand(1, 10 * level); correct = a + b; }
      else { a = rand(5, 10 * level + 5); b = rand(1, a); correct = a - b; }
      document.getElementById("question").textContent = a + " " + op + " " + b + " = ?";

      // 1 ta to'g'ri + 3 ta yaqin noto'g'ri javob
      var options = [correct];
      while (options.length < 4) {
        var wrong = correct + rand(-10, 10);
        if (wrong >= 0 && options.indexOf(wrong) === -1) options.push(wrong);
      }
      options.sort(function () { return Math.random() - 0.5; });

      var box = document.getElementById("answers");
      box.innerHTML = "";
      options.forEach(function (n, i) {
        var btn = document.createElement("button");
        btn.innerHTML = n + "<small>" + (i + 1) + "</small>";
        btn.dataset.value = n;
        btn.onclick = function () { answer(btn); };
        box.appendChild(btn);
      });
    }

    function answer(btn) {
      if (!playing) return;
      if (Number(btn.dataset.value) === correct) {
        score++;
        btn.classList.add("ok");
      } else {
        timeLeft = Math.max(0, timeLeft - 3); // xato uchun -3 soniya
        btn.classList.add("bad");
      }
      document.getElementById("score").textContent = score;
      setTimeout(newQuestion, 200);
    }

    function start() {
      score = 0; timeLeft = 60; playing = true;
      document.getElementById("score").textContent = 0;
      document.getElementById("startBox").style.display = "none";
      newQuestion();
      clearInterval(timer);
      timer = setInterval(tick, 100);
    }

    function tick() {
      timeLeft -= 0.1;
      document.getElementById("time").textContent = Math.ceil(Math.max(0, timeLeft));
      document.getElementById("bar").style.width = Math.max(0, timeLeft) / 60 * 100 + "%";
      if (timeLeft <= 0) end();
    }

    function end() {
      clearInterval(timer);
      playing = false;
      if (score > best) {
        best = score;
        localStorage.setItem("dovudxon-hisob-best", best);
        document.getElementById("best").textContent = best;
      }
      document.getElementById("question").textContent = "⏰ Vaqt tugadi! " + score + " ball";
      document.getElementById("answers").innerHTML = "";
      document.getElementById("start").textContent = "🔄 Yana o'ynash";
      document.getElementById("startBox").style.display = "block";
    }

    document.getElementById("start").onclick = start;
    document.addEventListener("keydown", function (e) {
      var buttons = document.querySelectorAll("#answers button");
      var i = Number(e.key) - 1;
      if (playing && buttons[i]) answer(buttons[i]);
      else if (!playing && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); start(); }
    });
  </script>
</body>
</html>
