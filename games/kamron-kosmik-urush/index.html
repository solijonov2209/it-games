<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosmik Urush O'yini</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px;
            font-size: 28px;
            text-shadow: 0 0 10px cyan;
        }
        canvas {
            border: 3px solid cyan;
            background: black;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            /* Katta canvas ekranga sig'ishi uchun proporsiyani saqlab kichrayadi */
            max-width: 96vw;
            max-height: calc(100vh - 110px);
            width: auto;
            height: auto;
        }
        .info {
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>🚀 Kosmik Urush 🌌</h1>
    <!-- Katta ekran o'lchami: 1440x1000 -->
    <canvas id="gameCanvas" width="1440" height="1000"></canvas>
    <div class="info">Boshqarish: <b>Chap/O'ng</b> strelkalar, Uzluksiz o'q otish: <b>Probelni bosib turish</b></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 5; 
        let isGameOver = false;
        
        let level = 1;
        let speedMultiplier = 1;

        let missedEnemiesCount = 0; 
        let lastHeartDropScore = 0; 

        let isShieldActive = false;
        let shieldTimer = 0;

        let player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 90,
            width: 50,
            height: 50,
            baseSpeed: 7,
            dx: 0
        };

        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let healthDrops = []; 
        let shieldDrops = []; 
        let stars = [];

        let isShooting = false;
        let shootTimer = 0;

        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 2 + 1
            });
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
                player.dx = -(player.baseSpeed + Math.floor(score / 100) * 0.3);
            } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
                player.dx = player.baseSpeed + Math.floor(score / 100) * 0.3;
            } else if (e.key === " ") {
                isShooting = true;
            }
        });

        window.addEventListener("keyup", (e) => {
            if (
                e.key === "ArrowLeft" || e.key === "a" || e.key === "A" ||
                e.key === "ArrowRight" || e.key === "d" || e.key === "D"
            ) {
                player.dx = 0;
            } else if (e.key === " ") {
                isShooting = false;
            }
        });

        function spawnEnemy() {
            let spawnChance = 0.03 + (score * 0.00005);
            if (Math.random() < spawnChance) {
                let enemyWidth = 45;
                let enemyHeight = 45;
                let enemyX = Math.random() * (canvas.width - enemyWidth);
                
                let baseSpeed = Math.random() * 2 + 2;
                enemies.push({
                    x: enemyX,
                    y: -50,
                    width: enemyWidth,
                    height: enemyHeight,
                    speed: baseSpeed * speedMultiplier
                });
            }
        }

        function update() {
            if (isGameOver) return;

            // Har 100 balda umumiy tezlik silliq oshib boradi
            speedMultiplier = 1 + (score * 0.0003);
            level = Math.floor(score / 100) + 1;

            if (isShieldActive) {
                shieldTimer--;
                if (shieldTimer <= 0) {
                    isShieldActive = false;
                }
            }

            if (score > 0 && score % 100 === 0 && score !== lastHeartDropScore && healthDrops.length === 0) {
                healthDrops.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: 3
                });
                lastHeartDropScore = score;
            }

            if (!isShieldActive && shieldDrops.length === 0 && Math.random() < 0.003) {
                shieldDrops.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: 3
                });
            }

            if (isShooting) {
                shootTimer++;
                if (shootTimer % 5 === 0) {
                    let extraBullets = Math.floor(score / 500) * 2; 
                    let totalBullets = 1 + extraBullets; 
                    let bulletSpeedBonus = Math.floor(score / 200) * 2;

                    let startX = player.x + player.width / 2 - (totalBullets * 6);
                    for (let k = 0; k < totalBullets; k++) {
                        bullets.push({
                            x: startX + (k * 12),
                            y: player.y,
                            width: 6,
                            height: 16,
                            speed: 16 + bulletSpeedBonus
                        });
                    }
                }
            } else {
                shootTimer = 0;
            }

            // O'yinchining harakat tezligi ham har 100 balda oshadi
            let currentSpeed = player.baseSpeed + Math.floor(score / 100) * 0.3;
            if (player.dx > 0) player.dx = currentSpeed;
            if (player.dx < 0) player.dx = -currentSpeed;

            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // O'qning o'qqa urilishi (O'yinchining o'qi dushman raketasini yo'q qiladi)
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemyBullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[i] && enemyBullets[j] &&
                        bullets[i].x < enemyBullets[j].x + enemyBullets[j].width &&
                        bullets[i].x + bullets[i].width > enemyBullets[j].x &&
                        bullets[i].y < enemyBullets[j].y + enemyBullets[j].height &&
                        bullets[i].y + bullets[i].height > enemyBullets[j].y
                    ) {
                        bullets.splice(i, 1);
                        enemyBullets.splice(j, 1);
                        break;
                    }
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].y += enemyBullets[i].speed;
                if (enemyBullets[i].y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (
                    player.x < enemyBullets[i].x + enemyBullets[i].width &&
                    player.x + player.width > enemyBullets[i].x &&
                    player.y < enemyBullets[i].y + enemyBullets[i].height &&
                    player.y + player.height > enemyBullets[i].y
                ) {
                    enemyBullets.splice(i, 1);
                    if (!isShieldActive) {
                        lives--;
                        if (lives <= 0) isGameOver = true;
                    }
                }
            }

            for (let i = healthDrops.length - 1; i >= 0; i--) {
                healthDrops[i].y += healthDrops[i].speed;
                if (healthDrops[i].y > canvas.height) {
                    healthDrops.splice(i, 1);
                    continue;
                }
                if (
                    player.x < healthDrops[i].x + healthDrops[i].width &&
                    player.x + player.width > healthDrops[i].x &&
                    player.y < healthDrops[i].y + healthDrops[i].height &&
                    player.y + player.height > healthDrops[i].y
                ) {
                    healthDrops.splice(i, 1);
                    lives += 1;
                }
            }

            for (let i = shieldDrops.length - 1; i >= 0; i--) {
                shieldDrops[i].y += shieldDrops[i].speed;
                if (shieldDrops[i].y > canvas.height) {
                    shieldDrops.splice(i, 1);
                    continue;
                }
                if (
                    player.x < shieldDrops[i].x + shieldDrops[i].width &&
                    player.x + player.width > shieldDrops[i].x &&
                    player.y < shieldDrops[i].y + shieldDrops[i].height &&
                    player.y + player.height > shieldDrops[i].y
                ) {
                    shieldDrops.splice(i, 1);
                    isShieldActive = true;
                    shieldTimer = 300; 
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    missedEnemiesCount++;
                    if (missedEnemiesCount >= 100) {
                        missedEnemiesCount = 0;
                        if (!isShieldActive) {
                            lives--;
                            if (lives <= 0) isGameOver = true;
                        }
                    }
                    continue;
                }

                if (score >= 200) {
                    let shootChance = 0.002 + (Math.floor(score / 200) * 0.0008);
                    if (Math.random() < shootChance) {
                        enemyBullets.push({
                            x: enemies[i].x + enemies[i].width / 2 - 2,
                            y: enemies[i].y + enemies[i].height,
                            width: 5,
                            height: 14,
                            speed: 6
                        });
                    }
                }

                if (
                    player.x < enemies[i].x + enemies[i].width &&
                    player.x + player.width > enemies[i].x &&
                    player.y < enemies[i].y + enemies[i].height &&
                    player.y + player.height > enemies[i].y
                ) {
                    enemies.splice(i, 1);
                    if (!isShieldActive) {
                        lives--;
                        if (lives <= 0) isGameOver = true;
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j] &&
                        bullets[j].x < enemies[i].x + enemies[i].width &&
                        bullets[j].x + bullets[j].width > enemies[i].x &&
                        bullets[j].y < enemies[i].y + enemies[i].height &&
                        bullets[j].y + bullets[j].height > enemies[i].y
                    ) {
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        break;
                    }
                }
            }

            for (let star of stars) {
                star.y += star.speed * speedMultiplier;
                if (star.y > canvas.height) star.y = 0;
            }

            spawnEnemy();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            for (let star of stars) {
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }

            if (isShieldActive) {
                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 35, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Oq rangdagi o'qlar
            ctx.fillStyle = "white";
            for (let bullet of bullets) {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            }

            ctx.fillStyle = "#ff4500";
            for (let eBullet of enemyBullets) {
                ctx.fillRect(eBullet.x, eBullet.y, eBullet.width, eBullet.height);
            }

            for (let h of healthDrops) {
                ctx.font = "26px Arial";
                ctx.fillText("❤️", h.x, h.y + 20);
            }

            for (let s of shieldDrops) {
                ctx.font = "26px Arial";
                ctx.fillText("🛡️", s.x, s.y + 20);
            }

            ctx.fillStyle = "#ff3366";
            for (let enemy of enemies) {
                ctx.beginPath();
                ctx.moveTo(enemy.x, enemy.y);
                ctx.lineTo(enemy.x + enemy.width, enemy.y);
                ctx.lineTo(enemy.x + enemy.width / 2, enemy.y + enemy.height);
                ctx.closePath();
                ctx.fill();
            }

            ctx.fillStyle = "white";
            ctx.font = "18px Arial";
            ctx.fillText("Ball: " + score, 20, 30);
            ctx.fillText("Daraja: " + level, 20, 60);
            ctx.fillText("O'tkazilgan dushman: " + missedEnemiesCount + "/100", 20, 90);
            ctx.fillText("Jon: " + lives, canvas.width - 110, 30);

            if (isShieldActive) {
                ctx.fillStyle = "cyan";
                ctx.fillText("Himoya: " + Math.ceil(shieldTimer / 60) + "s", canvas.width - 170, 60);
            }

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "red";
                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("O'YIN TUGADI", canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.fillText("Natija: " + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Qayta boshlash uchun sahifani yangilang (F5)", canvas.width / 2, canvas.height / 2 + 70);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
