<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'yin — IT School Games</title>
  <link rel="icon" href="assets/placeholder.svg">

  <!-- Tema sahifa chizilishidan oldin qo'yiladi -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem("gp_theme"));
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header play-header">
    <div class="container">
      <a class="back-btn" href="index.html">← <span>Orqaga</span></a>

      <div class="play-info">
        <h1 id="gameTitle">Yuklanmoqda...</h1>
        <p id="gameAuthor"></p>
      </div>

      <div class="play-actions">
        <button id="favBtn" class="icon-btn" type="button" title="Sevimlilarga qo'shish">♡</button>
        <button id="restartBtn" class="icon-btn" type="button" title="Qayta boshlash">↻</button>
        <button id="fullscreenBtn" class="icon-btn" type="button" title="To'liq ekran">⛶</button>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Kun/tun rejimi">🌙</button>
      </div>
    </div>
  </header>

  <main class="container" id="main">

    <!-- ===== O'yin oynasi ===== -->
    <div class="stage-wrap">
      <div id="stage" class="stage">
        <div id="loader" class="loader">
          <div class="spinner"></div>
          <div>O'yin yuklanmoqda...</div>
        </div>
        <!-- src play.js orqali beriladi -->
        <iframe id="gameFrame"
                title="O'yin"
                sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups"
                allow="fullscreen; autoplay; gamepad"
                allowfullscreen></iframe>
      </div>
    </div>

    <!-- ===== O'yin haqida ===== -->
    <div class="info-grid">
      <div class="panel">
        <h2>📖 O'yin haqida</h2>
        <p id="gameDesc"></p>
        <p style="margin-top:12px"><span id="gameCategory" class="badge"></span></p>
      </div>
      <div class="panel">
        <h2>🎮 Boshqaruv</h2>
        <div class="controls-box">⌨️ <span id="gameControls"></span></div>
      </div>
    </div>

    <!-- ===== Shu muallifning boshqa o'yinlari ===== -->
    <section id="authorSection" class="section hidden">
      <h2 class="section-title" id="authorTitle">👤 Muallifning boshqa o'yinlari</h2>
      <div id="authorRow" class="row"></div>
    </section>

    <!-- ===== O'xshash o'yinlar ===== -->
    <section id="similarSection" class="section hidden">
      <h2 class="section-title">✨ O'xshash o'yinlar</h2>
      <div id="similarRow" class="row"></div>
    </section>
  </main>

  <footer class="footer">
    Namangan IT School · O'quvchilar o'yinlari platformasi
  </footer>

  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
